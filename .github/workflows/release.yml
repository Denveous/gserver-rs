name: Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gserver-rs-linux
            asset_name: gserver-rs-linux
          - os: windows-latest
            artifact_name: gserver-rs-windows.exe
            asset_name: gserver-rs-windows.exe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build Release
      run: cargo build --release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/release/gserver-rs${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Delete old release
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: gserver-rs-linux
          path: ./artifacts/linux
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: gserver-rs-windows.exe
          path: ./artifacts/windows
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest Auto-Build"
          draft: false
          prerelease: false
          files: |
            ./artifacts/linux/gserver-rs
            ./artifacts/windows/gserver-rs.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
